<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notification settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5C7A}a:hover{color:#FF8FA0}
svg{display:block}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0F0C11; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
<header style="padding: 50px 8px 0 4px; height: 94px; box-sizing: border-box; display: flex; align-items: center">
<a href="Settings.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="flex: 1; margin: 0 52px 0 0; font-size: 17px; font-weight: 800; text-align: center">Notifications</h1>
</header>
<main style="padding: 0 16px; display: flex; flex-direction: column; gap: 22px">
<sc-if value="{{ blocked }}" hint-placeholder-val="{{ false }}">
<div role="status" style="padding: 16px; border-radius: 16px; background: #2B1A1E; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 15px; font-weight: 700">Notifications are off on this phone</div>
<div style="font-size: 14px; color: #D7C3CB; line-height: 1.5">Turn them on in your phone's settings to hear about new episodes.</div>
<button type="button" style="align-self: flex-start; height: 40px; padding: 0 18px; border-radius: 20px; border: none; background: #E0245E; color: #FFFFFF; font-size: 14px; font-weight: 700">Open phone settings</button>
</div>
</sc-if>
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column">
<h2 style="margin: 0 0 2px; font-size: 13px; font-weight: 600; color: #8E8794">{{ g.name }}</h2>
<sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="3">
<div style="min-height: 60px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1B1720; padding: 6px 0; box-sizing: border-box">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; color: {{ r.fg }}">{{ r.label }}</span>
<sc-if value="{{ r.hint }}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px; color: #8E8794">{{ r.hint }}</span></sc-if>
</span>
<button type="button" role="switch" aria-label="{{ r.label }}" aria-checked="{{ r.on }}" onClick="{{ r.toggle }}" disabled="{{ r.disabled }}" style="width: 52px; height: 32px; border-radius: 16px; border: none; padding: 3px; background: {{ r.bg }}; display: flex; justify-content: {{ r.justify }}; opacity: {{ r.opacity }}">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF"></span></button>
</div>
</sc-for>
</section>
</sc-for>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"permission":{"editor":"enum","options":["allowed","blocked"],"default":"allowed"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { ep: true, soon: true, offers: false, replies: true, checkin: true }; }
  renderVals() {
    const blocked = (this.props.permission ?? 'allowed') === 'blocked';
    const row = (key, label, hint, push) => {
      const off = push && blocked;
      const on = this.state[key] && !off;
      return {
        label, hint, on: on ? 'true' : 'false', disabled: off,
        bg: on ? '#E0245E' : '#3A3340', justify: on ? 'flex-end' : 'flex-start', opacity: off ? 0.5 : 1, fg: off ? '#8E8794' : '#FFFFFF',
        toggle: () => this.setState({ [key]: !this.state[key] })
      };
    };
    return {
      blocked,
      groups: [
        { name: 'Push notifications', rows: [
          row('ep', 'New episodes', 'Dramas in My List', true),
          row('soon', 'Premiere reminders', 'Dramas you asked to be reminded about', true),
          row('replies', 'Replies to my comments', '', true),
          row('offers', 'Rewards and offers', 'Bonus coins and VIP deals', true)
        ] },
        { name: 'On this device', rows: [
          row('checkin', 'Daily check-in reminder', 'A local reminder at 8:00 PM', false)
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
