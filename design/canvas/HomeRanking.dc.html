<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home · Rankings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5C7A}a:hover{color:#FF8FA0}
svg{display:block}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0F0C11; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
<header style="position: absolute; top: 0; left: 0; right: 0; z-index: 2; padding: 50px 12px 0 16px; height: 98px; box-sizing: border-box; display: flex; align-items: center; gap: 18px; background: #0F0C11">
<nav aria-label="Home sections" style="display: flex; align-items: baseline; gap: 18px; flex: 1">
<a href="Home.dc.html" style="color: #8E8794; font-size: 16px; font-weight: 600; text-decoration: none">For You</a>
<a href="HomeRanking.dc.html" aria-current="page" style="color: #FFFFFF; font-size: 20px; font-weight: 800; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px">Rankings<span style="width: 16px; height: 3px; border-radius: 2px; background: #FF3D5E"></span></a>
<a href="HomeNew.dc.html" style="color: #8E8794; font-size: 16px; font-weight: 600; text-decoration: none">New</a>
<a href="Category.dc.html" style="color: #8E8794; font-size: 16px; font-weight: 600; text-decoration: none">Genres</a>
</nav>
<a href="Search.dc.html" aria-label="Search" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
</a>
</header>

<main style="position: absolute; top: 98px; left: 0; right: 0; bottom: 124px; overflow: hidden; display: flex; flex-direction: column">
<div role="tablist" aria-label="Ranking type" style="display: flex; gap: 8px; padding: 6px 16px 14px">
<sc-for list="{{ lists }}" as="l" hint-placeholder-count="4">
<button type="button" role="tab" aria-selected="{{ l.sel }}" onClick="{{ l.pick }}" style="height: 34px; padding: 0 14px; border-radius: 17px; border: none; font-size: 14px; font-weight: 700; background: {{ l.bg }}; color: {{ l.fg }}">{{ l.label }}</button>
</sc-for>
</div>
<ol style="list-style: none; margin: 0; padding: 0 16px; display: flex; flex-direction: column">
<sc-for list="{{ rows }}" as="d" hint-placeholder-count="6">
<li style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #1B1720">
<span style="width: 26px; flex: none; text-align: center; font-size: 22px; font-weight: 900; font-style: italic; color: {{ d.rc }}">{{ d.rank }}</span>
<a href="Detail.dc.html" style="flex: none; position: relative; width: 66px; height: 88px; border-radius: 8px; overflow: hidden; background: {{ d.c }}" aria-label="{{ d.t }}">
<div style="position: absolute; width: 70px; height: 70px; border-radius: 50%; right: -18px; top: -12px; background: {{ d.c2 }}"></div>
</a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 15px; font-weight: 700; line-height: 1.3">{{ d.t }}</div>
<div style="font-size: 12px; color: #8E8794">{{ d.g }} · {{ d.ep }} EP</div>
<div style="font-size: 12px; color: #FFC46B; font-weight: 600">{{ d.note }}</div>
</div>
<a href="Player.dc.html" aria-label="Play {{ d.t }}" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: #2E1520; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z" fill="#FF5C7A"></path></svg>
</a>
</li>
</sc-for>
</ol>
</main>

<div style="position: absolute; left: 0; right: 0; bottom: 0">
<dc-import name="BottomBar" active="home" sub="none" hint-size="390px,124px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { list: 'Hot' }; }
  renderVals() {
    const names = ['Hot', 'Rising', 'Most saved', 'Completed'];
    const lists = names.map((label) => {
      const on = this.state.list === label;
      return { label, sel: on ? 'true' : 'false', bg: on ? '#FFFFFF' : '#1B1720', fg: on ? '#0F0C11' : '#B0A8B4', pick: () => this.setState({ list: label }) };
    });
    const medal = ['#F2C46D', '#C9CED6', '#D89A6A'];
    const data = [
      { t: "The Billionaire's Contract Bride", g: 'Romance · CEO', c: '#5B2333', c2: '#7A3546', ep: 80, note: 'Up 2 places' },
      { t: 'Reborn to Rule the Empire', g: 'Rebirth · Revenge', c: '#3B2A5E', c2: '#52407E', ep: 72, note: 'Exclusive' },
      { t: 'My Bodyguard Is a Hidden Heir', g: 'Hidden identity', c: '#1F3A5B', c2: '#2F5480', ep: 60, note: 'New this week' },
      { t: "Divorced, Now I'm the CEO", g: 'Revenge · Urban', c: '#5E3A1F', c2: '#80532F', ep: 90, note: '' },
      { t: "The Alpha King's Lost Mate", g: 'Werewolf', c: '#2C4A3A', c2: '#3E6651', ep: 68, note: '' },
      { t: 'Revenge of the True Daughter', g: 'Family', c: '#4A1F3D', c2: '#683058', ep: 75, note: '' }
    ];
    const rows = data.map((d, i) => Object.assign({}, d, { rank: i + 1, rc: medal[i] || '#6E6874' }));
    return { lists, rows };
  }
}
</script>
</body>
</html>
