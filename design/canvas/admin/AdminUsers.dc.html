<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin users</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5C7A}a:hover{color:#FF8FA0}
svg{display:block}
button,input{font-family:inherit}
input::placeholder{color:#8E8794}
th{font-weight:600;text-align:left}
</style>
</helmet>
<div style="min-height: 1000px; background: #0F0C11; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-wrap: wrap">
<div style="flex: 1 1 220px; display: flex"><dc-import name="AdminNav" active="users" hint-size="100%,1000px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; max-width: 1240px">
<h1 style="margin: 0; font-size: 26px; font-weight: 800">Users</h1>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<label style="flex: 1 1 280px; height: 42px; border-radius: 12px; border: 1.5px solid #3A3340; background: #1B1720; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #8E8794">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
<input type="search" aria-label="Search users" placeholder="Name, email or user ID" style="flex: 1; min-width: 0; background: none; border: none; outline: none; color: #FFFFFF; font-size: 14px"></label>
<div role="radiogroup" aria-label="Filter" style="display: flex; gap: 4px">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{ f.sel }}" onClick="{{ f.pick }}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; font-size: 13px; font-weight: 700; background: {{ f.bg }}; color: {{ f.fg }}; cursor: pointer">{{ f.label }}</button>
</sc-for>
</div>
</div>
<div style="overflow-x: auto; border-radius: 16px; background: #1B1720">
<table style="width: 100%; min-width: 880px; border-collapse: collapse; font-size: 14px">
<thead><tr style="color: #8E8794; font-size: 12px">
<th style="padding: 14px 16px">User</th><th style="padding: 14px 8px">Sign-in</th><th style="padding: 14px 8px">Coins</th><th style="padding: 14px 8px">VIP</th><th style="padding: 14px 8px">Joined</th><th style="padding: 14px 8px">Status</th>
</tr></thead>
<tbody>
<sc-for list="{{ rows }}" as="u" hint-placeholder-count="8">
<tr style="border-top: 1px solid #262029">
<td style="padding: 10px 16px"><a href="AdminUserDetail.dc.html" style="display: flex; align-items: center; gap: 10px; color: #FFFFFF; text-decoration: none">
<span aria-hidden="true" style="flex: none; width: 34px; height: 34px; border-radius: 17px; background: {{ u.av }}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">{{ u.i }}</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600">{{ u.name }}</span><span style="font-size: 12px; color: #8E8794">{{ u.email }} · ID {{ u.id }}</span></span></a></td>
<td style="padding: 10px 8px; color: #B0A8B4">{{ u.via }}</td>
<td style="padding: 10px 8px">{{ u.coins }}</td>
<td style="padding: 10px 8px; color: {{ u.vc }}">{{ u.vip }}</td>
<td style="padding: 10px 8px; color: #8E8794">{{ u.joined }}</td>
<td style="padding: 10px 8px; color: {{ u.sc }}; font-weight: 600">{{ u.status }}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #8E8794"><span>Showing 1–8</span><span style="display: flex; gap: 16px"><a href="AdminUsers.dc.html">Previous</a><a href="AdminUsers.dc.html">Next</a></span></div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 'All' }; }
  renderVals() {
    const filters = ['All', 'VIP', 'Paid coins', 'Banned'].map((label) => {
      const on = this.state.f === label;
      return { label, sel: on ? 'true' : 'false', bg: on ? '#FFFFFF' : '#1B1720', fg: on ? '#0F0C11' : '#B0A8B4', pick: () => this.setState({ f: label }) };
    });
    const mk = (i, av, name, email, id, via, coins, vip, joined, status) => ({
      i, av, name, email, id, via, coins, vip, joined, status,
      vc: vip === '—' ? '#8E8794' : '#F2C46D', sc: status === 'Active' ? '#7FD4A0' : '#FF8FA0'
    });
    const rows = [
      mk('M', '#7A3546', 'Mya Thandar', 'mya@example.com', '10293847', 'Google', '245', 'Until 23/11/2026', '02/10/2026', 'Active'),
      mk('Z', '#2F5480', 'Ko Zaw', 'zaw@example.com', '10293112', 'Email code', '1,020', '—', '28/09/2026', 'Active'),
      mk('L', '#3E6651', 'Lin', 'lin@example.com', '10292004', 'Apple', '60', 'Until 01/11/2026', '15/09/2026', 'Active'),
      mk('S', '#52407E', 'Su Su', 'susu@example.com', '10291876', 'Google', '0', '—', '11/09/2026', 'Active'),
      mk('A', '#80532F', 'Aung', 'aung@example.com', '10290455', 'Google', '3,400', 'Until 10/09/2027', '30/08/2026', 'Active'),
      mk('K', '#683058', 'Kyaw Kyaw', 'kyaw@example.com', '10289930', 'Email code', '15', '—', '22/08/2026', 'Banned'),
      mk('N', '#38486F', 'Nandar', 'nandar@example.com', '10289210', 'Google', '410', '—', '19/08/2026', 'Active'),
      mk('T', '#6E552D', 'Thu Zar', 'thuzar@example.com', '10288001', 'Apple', '90', 'Until 30/10/2026', '01/08/2026', 'Active')
    ];
    return { filters, rows };
  }
}
</script>
</body>
</html>
