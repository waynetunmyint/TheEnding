<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin home curation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5C7A}a:hover{color:#FF8FA0}
svg{display:block}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 1000px; background: #0F0C11; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-wrap: wrap">
<div style="flex: 1 1 220px; display: flex"><dc-import name="AdminNav" active="home" hint-size="100%,1000px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; max-width: 1240px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 26px; font-weight: 800">Home curation</h1>
<span style="font-size: 13px; color: #8E8794">What viewers see on the app and web Home. 2 unpublished changes.</span>
</div>
<button type="button" style="height: 42px; padding: 0 18px; border-radius: 21px; border: none; background: #E0245E; color: #FFFFFF; font-size: 14px; font-weight: 700">Publish changes</button>
</div>

<sc-for list="{{ sections }}" as="s" hint-placeholder-count="3">
<section style="padding: 18px 20px; border-radius: 16px; background: #1B1720; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<h2 style="margin: 0; flex: 1; font-size: 16px; font-weight: 800">{{ s.name }}</h2>
<span style="font-size: 13px; color: #8E8794">{{ s.hint }}</span>
<button type="button" style="height: 34px; padding: 0 14px; border-radius: 17px; border: none; background: #262029; color: #FFFFFF; font-size: 13px; font-weight: 700">+ Add drama</button>
</div>
<ol style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{ s.items }}" as="d" hint-placeholder-count="3">
<li style="min-height: 64px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #262029">
<button type="button" aria-label="Drag to reorder {{ d.t }}" style="width: 32px; height: 44px; border: none; background: none; color: #8E8794; cursor: grab; padding: 0; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg></button>
<span style="width: 18px; font-weight: 700; color: #8E8794">{{ d.n }}</span>
<div style="flex: none; width: {{ s.thumbW }}; height: 44px; border-radius: 6px; background: {{ d.c }}"></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600">{{ d.t }}</span>
<span style="font-size: 12px; color: #8E8794">{{ d.meta }}</span>
</div>
<button type="button" aria-label="Remove {{ d.t }}" style="width: 44px; height: 44px; border: none; background: none; color: #8E8794; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</li>
</sc-for>
</ol>
</section>
</sc-for>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const num = (arr) => arr.map((d, i) => Object.assign({ n: i + 1 }, d));
    return {
      sections: [
        { name: 'Banner', hint: 'Up to 5 · rotates every 5s', thumbW: '78px', items: num([
          { t: "The Billionaire's Contract Bride", c: '#5B2333', meta: 'Shows 20/10/2026 – 31/10/2026 · uses home banner image' },
          { t: 'The Duke Who Married a Maid', c: '#3A2A4E', meta: 'Starts 25/10/2026 · premiere' },
          { t: "Divorced, Now I'm the CEO", c: '#5E3A1F', meta: 'Always on' }
        ]) },
        { name: 'Trending now', hint: 'Automatic by unlocks · pinned items stay on top', thumbW: '33px', items: num([
          { t: 'Reborn to Rule the Empire', c: '#3B2A5E', meta: 'Pinned' },
          { t: 'My Bodyguard Is a Hidden Heir', c: '#1F3A5B', meta: 'Pinned until 27/10/2026' }
        ]) },
        { name: 'Coming soon', hint: 'Viewers can tap Remind me', thumbW: '33px', items: num([
          { t: 'The Duke Who Married a Maid', c: '#3A2A4E', meta: 'Premieres 25/10/2026 · 8:00 PM' },
          { t: 'My Ex-Husband Begs Again', c: '#4E2A2A', meta: 'Premieres 28/10/2026 · 8:00 PM' }
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
