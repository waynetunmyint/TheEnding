<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5C7A}a:hover{color:#FF8FA0}
svg{display:block}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 1000px; background: #0F0C11; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-wrap: wrap">
<div style="flex: 1 1 220px; display: flex"><dc-import name="AdminNav" active="dashboard" hint-size="100%,1000px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px; max-width: 1240px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<h1 style="margin: 0; flex: 1; font-size: 26px; font-weight: 800">Dashboard</h1>
<div role="radiogroup" aria-label="Range" style="display: flex; gap: 4px; background: #1B1720; border-radius: 12px; padding: 4px">
<sc-for list="{{ ranges }}" as="r" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{ r.sel }}" onClick="{{ r.pick }}" style="height: 34px; padding: 0 14px; border-radius: 9px; border: none; font-size: 13px; font-weight: 700; background: {{ r.bg }}; color: {{ r.fg }}">{{ r.label }}</button>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<sc-for list="{{ tiles }}" as="t" hint-placeholder-count="4">
<div style="padding: 18px; border-radius: 16px; background: #1B1720; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; color: #B0A8B4">{{ t.label }}</div>
<div style="font-size: 30px; font-weight: 800; letter-spacing: -0.5px">{{ t.value }}</div>
<div style="font-size: 12px; color: #8E8794">{{ t.note }}</div>
</div>
</sc-for>
</div>

<section aria-labelledby="rv" style="padding: 20px; border-radius: 16px; background: #1B1720; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap">
<h2 id="rv" style="margin: 0; font-size: 16px; font-weight: 800">Revenue per day (USD)</h2>
<span aria-live="polite" style="font-size: 13px; color: #B0A8B4; min-height: 18px">{{ hoverText }}</span>
</div>
<div role="img" aria-label="Bar chart of daily revenue for the last 14 days" style="position: relative; height: 220px; display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid #3A3340">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; border-top: 1px dashed #262029"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed #262029"></div>
<span aria-hidden="true" style="position: absolute; left: 0; top: -18px; font-size: 11px; color: #8E8794">$1,200</span>
<span aria-hidden="true" style="position: absolute; left: 0; top: calc(50% - 18px); font-size: 11px; color: #8E8794">$600</span>
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="14">
<div onMouseEnter="{{ b.enter }}" onMouseLeave="{{ b.leave }}" style="flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: default">
<div style="width: 100%; height: {{ b.h }}; border-radius: 4px 4px 0 0; background: {{ b.color }}"></div>
</div>
</sc-for>
</div>
<div aria-hidden="true" style="display: flex; justify-content: space-between; font-size: 11px; color: #8E8794"><span>10/10/2026</span><span>16/10/2026</span><span>23/10/2026</span></div>
</section>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px">
<section aria-labelledby="na" style="padding: 20px; border-radius: 16px; background: #1B1720; display: flex; flex-direction: column">
<h2 id="na" style="margin: 0 0 8px; font-size: 16px; font-weight: 800">Needs attention</h2>
<sc-for list="{{ todo }}" as="t" hint-placeholder-count="3">
<a href="{{ t.href }}" style="min-height: 48px; display: flex; align-items: center; gap: 10px; color: #FFFFFF; text-decoration: none; border-bottom: 1px solid #262029; font-size: 14px">
<span style="width: 8px; height: 8px; border-radius: 4px; background: {{ t.dot }}"></span>
<span style="flex: 1">{{ t.text }}</span><span style="color: #8E8794; font-size: 13px">{{ t.tag }} ›</span></a>
</sc-for>
</section>
<section aria-labelledby="tp" style="padding: 20px; border-radius: 16px; background: #1B1720; display: flex; flex-direction: column">
<h2 id="tp" style="margin: 0 0 8px; font-size: 16px; font-weight: 800">Top dramas this week</h2>
<sc-for list="{{ top }}" as="d" hint-placeholder-count="4">
<a href="AdminDramaEdit.dc.html" style="min-height: 48px; display: flex; align-items: center; gap: 12px; color: #FFFFFF; text-decoration: none; border-bottom: 1px solid #262029; font-size: 14px">
<span style="width: 18px; color: #8E8794; font-weight: 700">{{ d.n }}</span>
<span style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ d.t }}</span>
<span style="color: #B0A8B4; font-size: 13px">{{ d.unlocks }} unlocks</span></a>
</sc-for>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { range: '14 days', hover: -1 }; }
  renderVals() {
    const ranges = ['Today', '14 days', '90 days'].map((label) => {
      const on = this.state.range === label;
      return { label, sel: on ? 'true' : 'false', bg: on ? '#2E1520' : 'transparent', fg: on ? '#FFFFFF' : '#B0A8B4', pick: () => this.setState({ range: label }) };
    });
    const vals = [420, 510, 480, 620, 700, 655, 810, 760, 690, 880, 940, 905, 1010, 1080];
    const bars = vals.map((v, i) => ({
      h: Math.round(v / 1200 * 100) + '%',
      color: this.state.hover === i ? '#FF8FA0' : '#FF5C7A',
      enter: () => this.setState({ hover: i }),
      leave: () => this.setState({ hover: -1 })
    }));
    const h = this.state.hover;
    const day = (n) => String(10 + n).padStart(2, '0') + '/10/2026';
    return {
      ranges, bars,
      hoverText: h >= 0 ? day(h) + ' · $' + vals[h].toLocaleString('en-US') : 'Hover a bar for the day',
      tiles: [
        { label: 'Revenue', value: '$10,460', note: 'Coins + VIP · sample data' },
        { label: 'New users', value: '3,214', note: 'Signed up in range' },
        { label: 'Active VIP', value: '1,128', note: 'Paying today' },
        { label: 'Episodes unlocked', value: '48,903', note: 'Coins, ads and VIP' }
      ],
      todo: [
        { text: '2 payments pending over 1 hour', tag: 'Payments', href: 'AdminPayments.dc.html', dot: '#FFC46B' },
        { text: '5 reported comments', tag: 'Comments', href: 'AdminComments.dc.html', dot: '#FF5C7A' },
        { text: 'EP 42 of Reborn to Rule failed to process', tag: 'Episodes', href: 'AdminEpisodes.dc.html', dot: '#FF5C7A' }
      ],
      top: [
        { n: 1, t: "The Billionaire's Contract Bride", unlocks: '12,410' },
        { n: 2, t: 'Reborn to Rule the Empire', unlocks: '9,882' },
        { n: 3, t: "Divorced, Now I'm the CEO", unlocks: '7,305' },
        { n: 4, t: 'My Bodyguard Is a Hidden Heir', unlocks: '5,190' }
      ]
    };
  }
}
</script>
</body>
</html>
