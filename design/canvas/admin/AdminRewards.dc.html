<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin coins, VIP and rewards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5C7A}a:hover{color:#FF8FA0}
svg{display:block}
button,input{font-family:inherit}
th{font-weight:600;text-align:left}
label{font-size:13px;font-weight:600;color:#B0A8B4}
.num{height:42px;border-radius:10px;border:1.5px solid #3A3340;background:#0F0C11;color:#FFFFFF;font-size:14px;padding:0 10px;width:100%;box-sizing:border-box}
</style>
</helmet>
<div style="min-height: 1100px; background: #0F0C11; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-wrap: wrap">
<div style="flex: 1 1 220px; display: flex"><dc-import name="AdminNav" active="monetization" hint-size="100%,1100px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; max-width: 1240px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<h1 style="margin: 0; flex: 1; font-size: 26px; font-weight: 800">Coins, VIP &amp; rewards</h1>
<button type="button" style="height: 42px; padding: 0 18px; border-radius: 21px; border: none; background: #E0245E; color: #FFFFFF; font-size: 14px; font-weight: 700">Save changes</button>
</div>

<section aria-labelledby="dp" style="padding: 18px 20px; border-radius: 16px; background: #1B1720; display: flex; flex-direction: column; gap: 12px">
<h2 id="dp" style="margin: 0; font-size: 16px; font-weight: 800">Episode defaults</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="c1">Coins per episode</label><input id="c1" class="num" type="number" value="60"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="c2">Free episodes per drama</label><input id="c2" class="num" type="number" value="10"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="c3">Ad unlocks per user per day</label><input id="c3" class="num" type="number" value="3"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="c4">VIP daily bonus coins</label><input id="c4" class="num" type="number" value="20"></div>
</div>
</section>

<section aria-labelledby="cp" style="border-radius: 16px; background: #1B1720; display: flex; flex-direction: column">
<div style="padding: 18px 20px 6px; display: flex; align-items: center; gap: 12px"><h2 id="cp" style="margin: 0; flex: 1; font-size: 16px; font-weight: 800">Coin packs</h2><span style="font-size: 12px; color: #8E8794">Prices are set in Play Console and App Store Connect</span></div>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 760px; border-collapse: collapse; font-size: 14px">
<thead><tr style="color: #8E8794; font-size: 12px"><th style="padding: 10px 20px">Store product ID</th><th style="padding: 10px 8px">Coins</th><th style="padding: 10px 8px">Bonus</th><th style="padding: 10px 8px">Badge</th><th style="padding: 10px 8px">Store price</th><th style="padding: 10px 20px">On sale</th></tr></thead>
<tbody>
<sc-for list="{{ packs }}" as="p" hint-placeholder-count="6">
<tr style="border-top: 1px solid #262029">
<td style="padding: 10px 20px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #D7D0DA">{{ p.id }}</td>
<td style="padding: 10px 8px; width: 110px"><input class="num" type="number" aria-label="Coins for {{ p.id }}" value="{{ p.coins }}"></td>
<td style="padding: 10px 8px; width: 110px"><input class="num" type="number" aria-label="Bonus for {{ p.id }}" value="{{ p.bonus }}"></td>
<td style="padding: 10px 8px; width: 160px"><input class="num" type="text" aria-label="Badge for {{ p.id }}" value="{{ p.tag }}"></td>
<td style="padding: 10px 8px; color: #B0A8B4">{{ p.price }}</td>
<td style="padding: 10px 20px"><span role="switch" aria-checked="true" aria-label="On sale" style="width: 40px; height: 24px; border-radius: 12px; padding: 2px; box-sizing: border-box; background: #E0245E; display: flex; justify-content: flex-end"><span style="width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF"></span></span></td>
</tr>
</sc-for>
</tbody></table></div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 16px">
<section aria-labelledby="vp" style="flex: 1 1 360px; padding: 18px 20px; border-radius: 16px; background: #2A2112; color: #F2C46D; display: flex; flex-direction: column; gap: 4px">
<h2 id="vp" style="margin: 0 0 6px; font-size: 16px; font-weight: 800">VIP plans</h2>
<sc-for list="{{ vip }}" as="v" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #3A2E18; font-size: 14px"><span style="flex: 1; font-weight: 700">{{ v.name }}</span><span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #D9B571">{{ v.id }}</span><span>{{ v.price }}</span></div>
</sc-for>
</section>
<section aria-labelledby="ck" style="flex: 1 1 360px; padding: 18px 20px; border-radius: 16px; background: #1B1720; display: flex; flex-direction: column; gap: 12px">
<h2 id="ck" style="margin: 0; font-size: 16px; font-weight: 800">Daily check-in (7-day cycle)</h2>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; gap: 4px; align-items: center"><label for="{{ d.id }}" style="font-size: 11px">Day {{ d.n }}</label><input id="{{ d.id }}" class="num" type="number" value="{{ d.v }}" style="padding: 0 4px; text-align: center"></div>
</sc-for>
</div>
<h3 style="margin: 6px 0 0; font-size: 14px; font-weight: 700">Tasks</h3>
<sc-for list="{{ tasks }}" as="t" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; font-size: 14px"><span style="flex: 1">{{ t.name }}</span><input class="num" type="number" aria-label="Coins for {{ t.name }}" value="{{ t.v }}" style="width: 90px"></div>
</sc-for>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      packs: [
        { id: 'coins_100', coins: 100, bonus: 100, tag: 'First top-up x2', price: '$0.99' },
        { id: 'coins_500', coins: 500, bonus: 50, tag: 'Popular', price: '$4.99' },
        { id: 'coins_1000', coins: 1000, bonus: 150, tag: '', price: '$9.99' },
        { id: 'coins_2000', coins: 2000, bonus: 400, tag: '', price: '$19.99' },
        { id: 'coins_5000', coins: 5000, bonus: 1500, tag: 'Best value', price: '$49.99' },
        { id: 'coins_10000', coins: 10000, bonus: 4000, tag: '', price: '$99.99' }
      ],
      vip: [
        { name: 'Weekly', id: 'vip_weekly', price: '$4.99' },
        { name: 'Monthly', id: 'vip_monthly', price: '$14.99' },
        { name: 'Yearly', id: 'vip_yearly', price: '$99.99' }
      ],
      days: [10, 10, 15, 15, 20, 20, 50].map((v, i) => ({ v, n: i + 1, id: 'd' + (i + 1) })),
      tasks: [
        { name: 'Watch a short ad', v: 20 },
        { name: 'Watch 30 minutes in a day', v: 30 },
        { name: 'Turn on notifications', v: 20 },
        { name: 'Invite a friend (each side)', v: 50 }
      ]
    };
  }
}
</script>
</body>
</html>
