<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ad watched · unlocked</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5C7A}a:hover{color:#FF8FA0}
svg{display:block}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #000000; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
<dc-import name="Player" hint-size="390px,844px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(5, 3, 6, 0.75); display: flex; align-items: center; justify-content: center; padding: 0 28px">
<div role="dialog" aria-labelledby="ar" style="width: 100%; background: #1B1720; border-radius: 24px; padding: 28px 24px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<sc-if value="{{ ok }}" hint-placeholder-val="{{ true }}">
<div style="width: 64px; height: 64px; border-radius: 32px; background: #2E1520; color: #FF5C7A; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></div>
</sc-if>
<sc-if value="{{ failed }}" hint-placeholder-val="{{ false }}">
<div style="width: 64px; height: 64px; border-radius: 32px; background: #262029; color: #B0A8B4; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="2"></rect><path d="M8 21h8M4 4l16 16"></path></svg></div>
</sc-if>
<h2 id="ar" style="margin: 4px 0 0; font-size: 20px; font-weight: 800">{{ title }}</h2>
<p style="margin: 0; font-size: 15px; color: #B0A8B4; line-height: 1.5">{{ body }}</p>
<a href="{{ primaryHref }}" style="margin-top: 8px; width: 100%; height: 50px; border-radius: 25px; background: #E0245E; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">{{ primary }}</a>
<a href="Unlock.dc.html" style="width: 100%; height: 44px; color: #B0A8B4; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">{{ secondary }}</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["unlocked","ad failed"],"default":"unlocked"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = (this.props.state ?? 'unlocked') === 'unlocked';
    return ok ? {
      ok, failed: false, title: 'EP 13 unlocked',
      body: 'Thanks for watching. You have 2 free ad unlocks left today.',
      primary: 'Play EP 13', primaryHref: 'Player.dc.html', secondary: 'Back to unlock options'
    } : {
      ok, failed: true, title: "The ad didn't load",
      body: 'No coins were used. Try again, or unlock with coins or VIP.',
      primary: 'Try again', primaryHref: 'AdReward.dc.html', secondary: 'Other ways to unlock'
    };
  }
}
</script>
</body>
</html>
