<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse by genre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5C7A}a:hover{color:#FF8FA0}
svg{display:block}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0F0C11; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
<header style="position: absolute; top: 0; left: 0; right: 0; z-index: 2; padding: 50px 12px 0 16px; height: 98px; box-sizing: border-box; display: flex; align-items: center; gap: 18px; background: #0F0C11">
<nav aria-label="Home sections" style="display: flex; align-items: baseline; gap: 18px; flex: 1">
<a href="Home.dc.html" style="color: #8E8794; font-size: 16px; font-weight: 600; text-decoration: none">For You</a>
<a href="HomeRanking.dc.html" style="color: #8E8794; font-size: 16px; font-weight: 600; text-decoration: none">Rankings</a>
<a href="HomeNew.dc.html" style="color: #8E8794; font-size: 16px; font-weight: 600; text-decoration: none">New</a>
<a href="Category.dc.html" aria-current="page" style="color: #FFFFFF; font-size: 20px; font-weight: 800; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px">Genres<span style="width: 16px; height: 3px; border-radius: 2px; background: #FF3D5E"></span></a>
</nav>
<a href="Search.dc.html" aria-label="Search" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
</a>
</header>

<main style="position: absolute; top: 98px; left: 0; right: 0; bottom: 124px; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding-top: 6px">
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="3">
<div role="radiogroup" aria-label="{{ f.name }}" style="display: flex; gap: 6px; padding: 0 16px; overflow: hidden">
<sc-for list="{{ f.opts }}" as="o" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{ o.sel }}" onClick="{{ o.pick }}" style="flex: none; height: 32px; padding: 0 12px; border-radius: 16px; border: none; font-size: 13px; font-weight: 600; background: {{ o.bg }}; color: {{ o.fg }}">{{ o.label }}</button>
</sc-for>
</div>
</sc-for>
</div>
<div style="padding: 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ items }}" as="d" hint-placeholder-count="6">
<a href="Detail.dc.html" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #FFFFFF">
<div style="position: relative; height: 150px; border-radius: 10px; overflow: hidden; background: {{ d.c }}">
<div style="position: absolute; width: 120px; height: 120px; border-radius: 50%; right: -30px; top: -20px; background: {{ d.c2 }}"></div>
<span style="position: absolute; right: 6px; bottom: 6px; font-size: 10px; font-weight: 600; background: rgba(15, 12, 17, 0.6); padding: 2px 6px; border-radius: 6px">{{ d.ep }} EP</span>
</div>
<div style="font-size: 13px; font-weight: 600; line-height: 1.3">{{ d.t }}</div>
</a>
</sc-for>
</div>
</main>

<div style="position: absolute; left: 0; right: 0; bottom: 0">
<dc-import name="BottomBar" active="home" sub="none" hint-size="390px,124px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { Genre: 'Romance', Status: 'All', Sort: 'Popular' }; }
  renderVals() {
    const defs = [
      ['Genre', ['All', 'Romance', 'CEO', 'Revenge', 'Rebirth', 'Werewolf', 'Family']],
      ['Status', ['All', 'Completed', 'Ongoing', 'Free to watch']],
      ['Sort', ['Popular', 'Newest', 'Most episodes']]
    ];
    const filters = defs.map(([name, opts]) => ({
      name,
      opts: opts.map((label) => {
        const on = this.state[name] === label;
        return { label, sel: on ? 'true' : 'false', bg: on ? '#2E1520' : 'transparent', fg: on ? '#FF5C7A' : '#B0A8B4', pick: () => this.setState({ [name]: label }) };
      })
    }));
    const items = [
      { t: "The Billionaire's Contract Bride", c: '#5B2333', c2: '#7A3546', ep: 80 },
      { t: 'Love Contract With My Rival', c: '#5A2A2A', c2: '#7A3D3D', ep: 58 },
      { t: "The Emperor's Runaway Bride", c: '#4D3B1E', c2: '#6E552D', ep: 82 },
      { t: 'The Duke Who Married a Maid', c: '#3A2A4E', c2: '#52406E', ep: 66 },
      { t: 'My Bodyguard Is a Hidden Heir', c: '#1F3A5B', c2: '#2F5480', ep: 60 },
      { t: "The Alpha King's Lost Mate", c: '#2C4A3A', c2: '#3E6651', ep: 68 },
      { t: 'My Ex-Husband Begs Again', c: '#4E2A2A', c2: '#6E3D3D', ep: 70 },
      { t: 'Revenge of the True Daughter', c: '#4A1F3D', c2: '#683058', ep: 75 },
      { t: 'Reborn to Rule the Empire', c: '#3B2A5E', c2: '#52407E', ep: 72 }
    ];
    return { filters, items };
  }
}
</script>
</body>
</html>
