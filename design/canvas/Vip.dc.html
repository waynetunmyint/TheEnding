<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VIP membership</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#F2C46D}a:hover{color:#FFD98F}
svg{display:block}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #120F0B; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
<header style="padding: 50px 8px 0 4px; height: 94px; box-sizing: border-box; display: flex; align-items: center">
<a href="Me.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
<div style="flex: 1"></div>
<button type="button" style="height: 44px; background: none; border: none; color: #B0A8B4; font-size: 15px; padding: 0 8px">Restore</button>
</header>
<main style="padding: 0 20px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<svg width="48" height="48" viewBox="0 0 24 24" fill="#F2C46D" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"></path></svg>
<h1 style="margin: 0; font-size: 26px; font-weight: 900; color: #F2C46D">The Ending VIP</h1>
<p style="margin: 0; font-size: 15px; color: #D9CFC0">Every episode, every drama. No waiting, no ads.</p>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px">
<sc-for list="{{ perks }}" as="p" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #F5EDE0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2C46D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>{{ p }}</li>
</sc-for>
</ul>
<div role="radiogroup" aria-label="VIP plans" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ plans }}" as="p" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{ p.sel }}" onClick="{{ p.pick }}" style="position: relative; min-height: 68px; border-radius: 16px; border: 2px solid {{ p.ring }}; background: {{ p.bg }}; color: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 16px; text-align: left">
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 16px; font-weight: 800">{{ p.name }}</span>
<span style="font-size: 13px; color: #B8AC98">{{ p.note }}</span>
</span>
<span style="font-size: 18px; font-weight: 800">{{ p.price }}</span>
<sc-if value="{{ p.tag }}"><span style="position: absolute; top: -10px; left: 14px; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 8px; background: #F2C46D; color: #2A1A00">{{ p.tag }}</span></sc-if>
</button>
</sc-for>
</div>
</main>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 10px">
<a href="PaySuccess.dc.html" style="height: 54px; border-radius: 27px; background: #F2C46D; color: #2A1A00; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">{{ cta }}</a>
<p style="margin: 0; font-size: 11px; color: #9A9080; text-align: center; line-height: 1.5">{{ fine }} Cancel anytime in Google Play or App Store settings. <a href="About.dc.html">Terms</a> · <a href="About.dc.html">Privacy</a></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: 1 }; }
  renderVals() {
    const data = [
      { name: 'Weekly', price: '$4.99', note: 'Renews every 7 days', tag: '' },
      { name: 'Monthly', price: '$14.99', note: 'Renews every month', tag: 'Most popular' },
      { name: 'Yearly', price: '$99.99', note: '$8.33 a month · save 44%', tag: 'Best value' }
    ];
    const plans = data.map((d, i) => {
      const on = this.state.pick === i;
      return Object.assign({}, d, { sel: on ? 'true' : 'false', ring: on ? '#F2C46D' : 'transparent', bg: on ? '#2A2112' : '#1E1914', pick: () => this.setState({ pick: i }) });
    });
    const cur = data[this.state.pick];
    return {
      perks: ['All episodes unlocked', 'No ads', '1080p and 4K', 'New dramas first', '+20 coins daily', 'Watch on web too'],
      plans,
      cta: 'Start ' + cur.name + ' VIP · ' + cur.price,
      fine: cur.name + ' plan renews automatically at ' + cur.price + '.'
    };
  }
}
</script>
</body>
</html>
