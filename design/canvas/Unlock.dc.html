<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Locked episode · unlock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5C7A}a:hover{color:#FF8FA0}
svg{display:block}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #000000; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
<dc-import name="Player" hint-size="390px,844px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(5, 3, 6, 0.7)"></div>
<div style="position: absolute; left: 0; right: 0; top: 200px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="width: 56px; height: 56px; border-radius: 28px; background: rgba(255, 255, 255, 0.12); display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></div>
<div style="font-size: 15px; font-weight: 700">Episode 13 is locked</div>
</div>

<section role="dialog" aria-labelledby="ul" style="position: absolute; left: 0; right: 0; bottom: 0; background: #1B1720; border-radius: 20px 20px 0 0; padding: 8px 16px 36px; display: flex; flex-direction: column; gap: 14px">
<div style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #3A3340"></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="ul" style="margin: 0; font-size: 18px; font-weight: 800">Unlock EP 13</h2>
<a href="Wallet.dc.html" style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #FFFFFF; text-decoration: none; min-height: 44px">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFB020"></circle><circle cx="12" cy="12" r="6.5" fill="none" stroke="#B26F00" stroke-width="1.6"></circle></svg>
Balance <strong>{{ balance }}</strong></a>
</div>

<a href="{{ coinHref }}" style="height: 54px; border-radius: 27px; background: #E0245E; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFB020"></circle><circle cx="12" cy="12" r="6.5" fill="none" stroke="#B26F00" stroke-width="1.6"></circle></svg>
{{ coinLabel }}</a>

<a href="AdReward.dc.html" style="height: 54px; border-radius: 27px; background: #262029; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="2"></rect><path d="M8 21h8M10 9l4 2.5-4 2.5z"></path></svg>
Watch a short ad · free<span style="font-weight: 500; color: #8E8794">3 left today</span></a>

<a href="Vip.dc.html" style="padding: 14px 16px; border-radius: 16px; background: #2A2112; color: #F2C46D; text-decoration: none; display: flex; align-items: center; gap: 12px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="#F2C46D" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 800">Join VIP · watch everything</span>
<span style="font-size: 13px; color: #D9B571">All episodes unlocked, no ads, 1080p</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>

<div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
<label for="au" style="font-size: 14px; color: #B0A8B4">Auto-unlock next episodes with coins</label>
<button id="au" type="button" role="switch" aria-checked="{{ auStr }}" onClick="{{ toggleAu }}" style="width: 52px; height: 32px; border-radius: 16px; border: none; padding: 3px; background: {{ auBg }}; display: flex; justify-content: {{ auJustify }}">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF"></span></button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"balance":{"editor":"int","default":120,"min":0,"max":999},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { au: false }; }
  renderVals() {
    const balance = this.props.balance ?? 120;
    const price = 60;
    const enough = balance >= price;
    const au = this.state.au;
    return {
      balance,
      coinHref: enough ? 'Player.dc.html' : 'TopUpSheet.dc.html',
      coinLabel: enough ? 'Unlock for ' + price + ' coins' : 'Top up to unlock · ' + price + ' coins',
      auStr: au ? 'true' : 'false', auBg: au ? '#E0245E' : '#3A3340', auJustify: au ? 'flex-end' : 'flex-start',
      toggleAu: () => this.setState({ au: !au })
    };
  }
}
</script>
</body>
</html>
