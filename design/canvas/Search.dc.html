<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5C7A}a:hover{color:#FF8FA0}
svg{display:block}
button,input{font-family:inherit}
input::placeholder{color:#8E8794}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0F0C11; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">
<header style="padding: 50px 8px 0 4px; display: flex; align-items: center; gap: 4px">
<a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<label style="flex: 1; height: 42px; border-radius: 21px; background: #1B1720; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #8E8794">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
<input type="search" aria-label="Search dramas" placeholder="Search dramas, actors, genres" style="flex: 1; min-width: 0; background: none; border: none; outline: none; color: #FFFFFF; font-size: 15px">
</label>
<a href="SearchResults.dc.html" style="height: 44px; padding: 0 8px; display: flex; align-items: center; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">Search</a>
</header>

<section aria-labelledby="rc" style="padding: 20px 16px 0">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="rc" style="margin: 0; font-size: 16px; font-weight: 800">Recent</h2>
<button type="button" aria-label="Clear recent searches" style="width: 44px; height: 44px; background: none; border: none; color: #8E8794; display: flex; align-items: center; justify-content: flex-end; padding: 0; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ recent }}" as="r" hint-placeholder-count="4">
<a href="SearchResults.dc.html" style="height: 34px; padding: 0 14px; border-radius: 17px; background: #1B1720; color: #E6E0E8; font-size: 14px; display: flex; align-items: center; text-decoration: none">{{ r }}</a>
</sc-for>
</div>
</section>

<section aria-labelledby="ts" style="padding: 28px 16px 0">
<h2 id="ts" style="margin: 0 0 6px; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="#FF5C7A" aria-hidden="true"><path d="M12 2c1 4 6 5.5 6 11a6 6 0 0 1-12 0c0-3 1.6-4.6 2.6-6.5.6 1.6 1.4 2.6 2.6 3.2C11 7 11 4.5 12 2z"></path></svg>Trending searches</h2>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px">
<sc-for list="{{ trend }}" as="t" hint-placeholder-count="10">
<li><a href="SearchResults.dc.html" style="height: 44px; display: flex; align-items: center; gap: 10px; color: #FFFFFF; text-decoration: none; font-size: 14px">
<span style="width: 16px; font-weight: 900; font-style: italic; color: {{ t.rc }}">{{ t.n }}</span>
<span style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ t.q }}</span>
</a></li>
</sc-for>
</ol>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const qs = ['Contract bride', 'Hidden heir', 'Rebirth revenge', 'Alpha king', 'Divorced CEO', 'True daughter', 'Runaway bride', 'Night market', 'Sweet love', 'Bodyguard'];
    const medal = ['#FF5C7A', '#FF8A5C', '#FFC46B'];
    return {
      recent: ['CEO', 'Werewolf', 'The Duke', 'Revenge'],
      trend: qs.map((q, i) => ({ q, n: i + 1, rc: medal[i] || '#8E8794' }))
    };
  }
}
</script>
</body>
</html>
