<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Series finished</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5C7A}a:hover{color:#FF8FA0}
svg{display:block}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0F0C11; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">
<header style="padding: 50px 4px 0; height: 94px; box-sizing: border-box; display: flex; align-items: center">
<a href="Detail.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</header>
<div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 700; color: #FF5C7A">The End · 80 of 80 watched</div>
<h1 style="margin: 0; font-size: 24px; font-weight: 800; line-height: 1.25">You finished The Billionaire's Contract Bride</h1>
</div>
<div style="padding: 18px 20px 0; display: flex; align-items: center; gap: 10px">
<span style="font-size: 14px; color: #B0A8B4; flex: 1">Did you enjoy it?</span>
<button type="button" onClick="{{ up }}" aria-pressed="{{ upSel }}" style="height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: {{ upBg }}; color: #FFFFFF; font-size: 14px; font-weight: 700">Loved it</button>
<button type="button" onClick="{{ down }}" aria-pressed="{{ downSel }}" style="height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: {{ downBg }}; color: #FFFFFF; font-size: 14px; font-weight: 700">Not for me</button>
</div>

<section aria-labelledby="un" style="padding: 26px 20px 0">
<h2 id="un" style="margin: 0 0 12px; font-size: 17px; font-weight: 800">Up next</h2>
<a href="Player.dc.html" style="display: flex; gap: 14px; text-decoration: none; color: #FFFFFF">
<div style="flex: none; position: relative; width: 120px; height: 160px; border-radius: 12px; overflow: hidden; background: #3A2A4E">
<div style="position: absolute; width: 130px; height: 130px; border-radius: 50%; right: -34px; top: -24px; background: #52406E"></div>
<div style="position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 22px; background: rgba(15, 12, 17, 0.6); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z" fill="#FFFFFF"></path></svg></div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px; padding-top: 4px">
<div style="font-size: 17px; font-weight: 800; line-height: 1.3">The Duke Who Married a Maid</div>
<div style="font-size: 13px; color: #8E8794">Romance · Historical · 66 EP</div>
<div style="font-size: 13px; color: #B0A8B4; line-height: 1.45">Because you loved contract-marriage romance.</div>
<div style="margin-top: auto; font-size: 13px; font-weight: 700; color: #FF5C7A">Playing in 5s</div>
</div>
</a>
</section>

<section aria-labelledby="ml" style="padding: 26px 20px 0">
<h2 id="ml" style="margin: 0 0 12px; font-size: 17px; font-weight: 800">More like this</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ more }}" as="d" hint-placeholder-count="3">
<a href="Detail.dc.html" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #FFFFFF">
<div style="position: relative; height: 140px; border-radius: 10px; overflow: hidden; background: {{ d.c }}">
<div style="position: absolute; width: 110px; height: 110px; border-radius: 50%; right: -28px; top: -18px; background: {{ d.c2 }}"></div>
</div>
<div style="font-size: 13px; font-weight: 600; line-height: 1.3">{{ d.t }}</div>
</a>
</sc-for>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { vote: 'up' }; }
  renderVals() {
    const v = this.state.vote;
    return {
      upSel: v === 'up' ? 'true' : 'false', downSel: v === 'down' ? 'true' : 'false',
      upBg: v === 'up' ? '#E0245E' : '#1B1720', downBg: v === 'down' ? '#3A3340' : '#1B1720',
      up: () => this.setState({ vote: 'up' }), down: () => this.setState({ vote: 'down' }),
      more: [
        { t: 'Love Contract With My Rival', c: '#5A2A2A', c2: '#7A3D3D' },
        { t: "The Emperor's Runaway Bride", c: '#4D3B1E', c2: '#6E552D' },
        { t: 'My Ex-Husband Begs Again', c: '#4E2A2A', c2: '#6E3D3D' }
      ]
    };
  }
}
</script>
</body>
</html>
