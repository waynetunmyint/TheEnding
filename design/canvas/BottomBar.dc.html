<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bottom bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
svg{display:block}
</style>
</helmet>
<div style="width: 390px; background: #0F0C11; color: #FFFFFF; font-family: Inter, system-ui, sans-serif">
<sc-if value="{{ showSub }}" hint-placeholder-val="{{ true }}">
<a href="/Vip.dc.html" style="height: 40px; padding: 0 16px; display: flex; align-items: center; gap: 8px; background: {{ sub.bg }}; color: {{ sub.fg }}; text-decoration: none; font-size: 13px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"></path></svg>
<span style="font-weight: 700">{{ sub.state }}</span>
<span style="flex: 1; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ sub.detail }}</span>
<span style="font-weight: 700">{{ sub.action }}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
</a>
</sc-if>
<nav aria-label="Main" style="height: 56px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #221D26">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
<a href="{{ t.href }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{ t.color }}; text-decoration: none; font-size: 11px; font-weight: 600">
<sc-if value="{{ t.isHome }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg></sc-if>
<sc-if value="{{ t.isShorts }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="m10 9 5 3-5 3z"></path></svg></sc-if>
<sc-if value="{{ t.isRewards }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"></rect><path d="M12 8v13M3 12h18M12 8C10 4 6 4 6 6.5S9 8 12 8zm0 0c2-4 6-4 6-1.5S15 8 12 8z"></path></svg></sc-if>
<sc-if value="{{ t.isList }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></sc-if>
<sc-if value="{{ t.isMe }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></sc-if>
<span>{{ t.label }}</span>
</a>
</sc-for>
</nav>
<div style="height: 28px; display: flex; align-items: center; justify-content: center"><div style="width: 134px; height: 5px; border-radius: 3px; background: #3A3340"></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","shorts","rewards","mylist","me"],"default":"home"},"sub":{"editor":"enum","options":["none","pending","active","ending","expired","rejected","hidden"],"default":"none"},"$preview":{"width":390,"height":124}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const subKey = this.props.sub ?? 'none';
    const subs = {
      none: { state: 'VIP', detail: 'Unlock every episode, no ads', action: 'Join', bg: '#2A2112', fg: '#F2C46D' },
      pending: { state: 'Payment pending', detail: 'We are confirming your payment', action: 'View', bg: '#1E2533', fg: '#9CC3FF' },
      active: { state: 'VIP active', detail: 'Renews 23/11/2026', action: 'Manage', bg: '#2A2112', fg: '#F2C46D' },
      ending: { state: 'VIP ends soon', detail: 'Expires 28/10/2026 · 5 days left', action: 'Renew', bg: '#33240F', fg: '#FFC46B' },
      expired: { state: 'VIP expired', detail: 'Ended 15/10/2026', action: 'Renew', bg: '#2B1A1E', fg: '#FF8FA0' },
      rejected: { state: 'Payment declined', detail: 'Your last payment did not go through', action: 'Fix', bg: '#2B1A1E', fg: '#FF8FA0' }
    };
    const defs = [
      ['home', 'Home', '/Home.dc.html'],
      ['shorts', 'Shorts', '/Shorts.dc.html'],
      ['rewards', 'Rewards', '/Rewards.dc.html'],
      ['mylist', 'My List', '/MyList.dc.html'],
      ['me', 'Me', '/Me.dc.html']
    ];
    const tabs = defs.map(([k, label, href]) => ({
      label, href,
      color: k === active ? '#FFFFFF' : '#8E8794',
      isHome: k === 'home', isShorts: k === 'shorts', isRewards: k === 'rewards', isList: k === 'mylist', isMe: k === 'me'
    }));
    return { tabs, showSub: subKey !== 'hidden', sub: subs[subKey] || subs.none };
  }
}
</script>
</body>
</html>
