<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login · 6-digit code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5C7A}a:hover{color:#FF8FA0}
svg{display:block}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0F0C11; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 52px 20px 40px; box-sizing: border-box">
<a href="LoginEmail.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; color: #FFFFFF">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 20px 0 8px; font-size: 28px; font-weight: 800; letter-spacing: -0.5px">Enter the code</h1>
<p style="margin: 0 0 32px; font-size: 15px; color: #B0A8B4; line-height: 1.5">Sent to mya.thandar@gmail.com · <a href="LoginEmail.dc.html">Change</a></p>
<div role="group" aria-label="6-digit code" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ boxes }}" as="b" hint-placeholder-count="6">
<div style="height: 58px; border-radius: 14px; background: #1B1720; border: 1.5px solid {{ b.border }}; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700">{{ b.digit }}</div>
</sc-for>
</div>
<sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
<div role="alert" style="margin-top: 14px; display: flex; gap: 8px; align-items: center; color: #FF8FA0; font-size: 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>
That code is incorrect. 3 tries left.
</div>
</sc-if>
<div style="margin-top: 24px; font-size: 14px; color: #8E8794">
<sc-if value="{{ canResend }}" hint-placeholder-val="{{ false }}"><button type="button" style="background: none; border: none; padding: 10px 0; color: #FF5C7A; font-size: 14px; font-weight: 700">Resend code</button></sc-if>
<sc-if value="{{ waiting }}" hint-placeholder-val="{{ true }}"><span>Resend code in 0:42</span></sc-if>
</div>
<div style="flex: 1"></div>
<a href="NotifyOptIn.dc.html" style="height: 52px; border-radius: 26px; background: {{ btnBg }}; color: {{ btnFg }}; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Verify</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["entering","error"],"default":"entering"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const isError = (this.props.state ?? 'entering') === 'error';
    const digits = isError ? ['4', '8', '2', '1', '9', '0'] : ['4', '8', '2', '1', '', ''];
    const boxes = digits.map((d, i) => ({
      digit: d,
      border: isError ? '#FF5C7A' : (i === 4 ? '#FF5C7A' : 'transparent')
    }));
    return {
      boxes, isError, canResend: isError, waiting: !isError,
      btnBg: isError ? '#E0245E' : '#2A2430', btnFg: isError ? '#FFFFFF' : '#8E8794'
    };
  }
}
</script>
</body>
</html>
