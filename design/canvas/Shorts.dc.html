<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shorts feed</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5C7A}a:hover{color:#FF8FA0}
svg{display:block}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #000000; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
<div aria-label="Video: The Alpha King's Lost Mate trailer" role="img" style="position: absolute; left: 0; right: 0; top: 0; bottom: 124px; background: #2C4A3A; overflow: hidden">
<div style="position: absolute; width: 420px; height: 420px; border-radius: 50%; left: -60px; top: 120px; background: #3E6651"></div>
<div style="position: absolute; width: 220px; height: 220px; border-radius: 50%; right: -40px; top: 60px; background: #355A47"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: rgba(0, 0, 0, 0.45)"></div>
</div>

<header style="position: absolute; top: 50px; left: 0; right: 0; height: 44px; display: flex; align-items: center; justify-content: center; gap: 22px">
<a href="Shorts.dc.html" aria-current="page" style="color: #FFFFFF; font-size: 17px; font-weight: 800; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px">For You<span style="width: 16px; height: 3px; border-radius: 2px; background: #FFFFFF"></span></a>
<a href="MyList.dc.html" style="color: rgba(255, 255, 255, 0.7); font-size: 16px; font-weight: 600; text-decoration: none">Following</a>
<a href="Search.dc.html" aria-label="Search" style="position: absolute; right: 8px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
</a>
</header>

<div style="position: absolute; right: 8px; bottom: 270px; display: flex; flex-direction: column; align-items: center; gap: 14px">
<a href="Detail.dc.html" aria-label="Drama details" style="width: 46px; height: 62px; border-radius: 8px; border: 2px solid #FFFFFF; background: #3E6651; display: block"></a>
<button type="button" onClick="{{ toggleLike }}" aria-pressed="{{ likedStr }}" style="width: 56px; background: none; border: none; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; padding: 0">
<svg width="32" height="32" viewBox="0 0 24 24" fill="{{ heartFill }}" stroke="{{ heartStroke }}" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg>Like</button>
<button type="button" style="width: 56px; background: none; border: none; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; padding: 0">
<svg width="30" height="30" viewBox="0 0 24 24" fill="#FFC46B" stroke="#FFC46B" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Saved</button>
<a href="Episodes.dc.html" style="width: 56px; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; text-decoration: none">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Episodes</a>
<a href="Share.dc.html" style="width: 56px; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; text-decoration: none">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7h16v-7M12 3v12M7 8l5-5 5 5"></path></svg>Share</a>
</div>

<div style="position: absolute; left: 16px; right: 84px; bottom: 182px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 17px; font-weight: 800">The Alpha King's Lost Mate</div>
<div style="font-size: 14px; color: #E6E0E8; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">Rejected on her wedding night, she runs. Five years later the Alpha King finds her, and the son he never knew about.</div>
<div style="display: flex; gap: 6px; font-size: 12px; color: #FFFFFF">
<span style="padding: 3px 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.16)">Werewolf</span>
<span style="padding: 3px 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.16)">Second chance</span>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 164px; height: 2px; background: rgba(255, 255, 255, 0.25)"><div style="width: 38%; height: 2px; background: #FFFFFF"></div></div>

<div style="position: absolute; left: 0; right: 0; bottom: 124px; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: rgba(15, 12, 17, 0.92)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="m10 9 5 3-5 3z"></path></svg>
<a href="Player.dc.html" style="flex: 1; color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: space-between">Watch full series · 68 episodes<span style="color: #FF5C7A; font-weight: 700">EP 1 ›</span></a>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0">
<dc-import name="BottomBar" active="shorts" sub="none" hint-size="390px,124px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { liked: true }; }
  renderVals() {
    const liked = this.state.liked;
    return {
      likedStr: liked ? 'true' : 'false',
      heartFill: liked ? '#FF3D5E' : 'none',
      heartStroke: liked ? '#FF3D5E' : '#FFFFFF',
      toggleLike: () => this.setState({ liked: !liked })
    };
  }
}
</script>
</body>
</html>
