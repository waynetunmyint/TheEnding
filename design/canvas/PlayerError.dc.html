<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player · buffering / error</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5C7A}a:hover{color:#FF8FA0}
svg{display:block}
button{font-family:inherit;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #000000; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
<div style="position: absolute; inset: 0; background: #120E14"></div>
<header style="position: absolute; top: 50px; left: 4px; right: 4px; height: 44px; display: flex; align-items: center; gap: 4px">
<a href="Detail.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex: 1; min-width: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">The Billionaire's Contract Bride · EP 5</div>
</header>

<sc-if value="{{ buffering }}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 0; right: 0; top: 340px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 0 40px">
<div style="width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.2); border-top-color: #FF3D5E; animation: spin 0.9s linear infinite"></div>
<div style="font-size: 15px; font-weight: 600">Loading EP 5…</div>
<div style="font-size: 13px; color: #B0A8B4">Slow connection. <a href="PlayerPaused.dc.html">Switch to 480p</a></div>
</div>
</sc-if>

<sc-if value="{{ failed }}" hint-placeholder-val="{{ true }}">
<div role="alert" style="position: absolute; left: 0; right: 0; top: 300px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 0 40px">
<div style="width: 64px; height: 64px; border-radius: 32px; background: #1B1720; color: #B0A8B4; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg></div>
<h1 style="margin: 6px 0 0; font-size: 20px; font-weight: 800">Can't play this episode</h1>
<p style="margin: 0; font-size: 15px; color: #B0A8B4; line-height: 1.5">Check your connection and try again. Your coins and progress are safe.</p>
<a href="Player.dc.html" style="margin-top: 10px; height: 48px; padding: 0 32px; border-radius: 24px; background: #E0245E; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; text-decoration: none">Try again</a>
<a href="Help.dc.html" style="height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none">Report a problem</a>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["error","buffering"],"default":"error"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const failed = (this.props.state ?? 'error') === 'error';
    return { failed, buffering: !failed };
  }
}
</script>
</body>
</html>
